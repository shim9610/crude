[workspace]
members = [
    "crates/collector",
    "crates/browser",
    "ui", 
]
resolver = "3"

[package]
name = "crude"
version = "0.1.4"
edition = "2024"
description = "Chrome driver version manager and flexible crawling logic builder with optional GUI editor"
license = "MIT"
repository = "https://github.com/shim9610/Crude"
default-run = "crude-ui"

[dependencies]
iced-mouse-layer = { git = "https://github.com/shim9610/iced-mouse-layer", optional = true }
iced = { version = "0.14", features = ["advanced"], optional = true }
collector = { path = "crates/collector" }
browser = { path = "crates/browser" }
anyhow = "1.0.102"
tokio = { version = "1.52.0", features = ["full"] }
serde_json = "1.0.149"
rfd = "0.17.2"


[features]
default = []
dev-tools = ["dep:iced", "dep:iced-mouse-layer","collector/ui"]
[[bin]]
name = "crude-ui"
path = "src/bin/crude-ui.rs"
required-features = ["dev-tools"]
[[bin]]
name = "browser_runner"
path = "src/bin/browser_runner.rs"
required-features = ["dev-tools"]

[profile.release]  
opt-level = 2
lto = false
codegen-units = 16
strip = true
